name: Build release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Generate POT
        uses: hivepress/action-generate-pot@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          composer install -o --no-dev
          if [ -f package.json ]; then npm install --omit=dev && node build.js; fi

      - name: Pack release
        run: |
          rm -rf .git* composer.* phpcs.xml package.json package-lock.json build.js node_modules README.md
          cd ..
          zip -r ${{ github.event.repository.name }}.zip ${{ github.event.repository.name }}

      - name: Upload release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ../${{ github.event.repository.name }}.zip

  update-code-reference:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Build code reference
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: Build code reference
          repo: hivepress/code-reference
          token: ${{ secrets.PERSONAL_TOKEN }}
          ref: refs/heads/main
          inputs: '{ "version": "${{ github.event.release.tag_name }}" }'
          wait-for-completion: true

  update-hook-reference:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Build hook reference
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: Build hook reference
          repo: hivepress/hook-reference
          token: ${{ secrets.PERSONAL_TOKEN }}
          ref: refs/heads/main
          wait-for-completion: true

  update-api-reference:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer

      - name: Install Swagger
        run: composer require "zircote/swagger-php:^3.3"

      - name: Generate OpenAPI
        run: vendor/bin/openapi . -e vendor -o openapi.yaml

      - name: Deploy documentation
        uses: bump-sh/github-action@v1
        with:
          doc: rest-api
          token: ${{ secrets.BUMP_TOKEN }}
          file: openapi.yaml
